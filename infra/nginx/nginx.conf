# DesignRoom edge proxy (architecture §14): one entry point, like production.
#   http://localhost:8080/       -> Vite dev server on the host (incl. hot-reload WebSocket)
#   http://localhost:8080/api/*  -> Hono server on the host
#   ws://localhost:8080/ws/*     -> the same server: rooms' live sync (M2)
# In M3 the `api` upstream gets a second server: Nginx becomes the load balancer.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # One JSON object per request, so logs can be shipped to Loki (Grafana) and queried by field.
  # request_id is also sent to the server (X-Request-Id): the same id in both logs.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # The apps run on the host, not in Docker: host.docker.internal reaches them.
  upstream web {
    server host.docker.internal:5173;
  }
  upstream api {
    server host.docker.internal:3000;
  }

  # WebSocket handshake (Vite hot reload now, Yjs sync in M2): pass "Upgrade" through, and only
  # say "Connection: upgrade" when the client asked for one (plain requests get "close").
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Each chat request holds the GPU for seconds: at most 10 a minute per client IP, a burst of
  # 3 allowed; beyond that Nginx answers 429 itself and the server never sees the request.
  limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;
  # Opening a room's WebSocket (M2): a page opens one and reconnects after drops; 30 a minute per
  # IP with a burst of 10 leaves room for that, not for a script opening thousands.
  limit_req_zone $binary_remote_addr zone=rooms:10m rate=30r/m;
  limit_req_status 429;

  server {
    listen 80;

    # The board travels with every chat request: refuse absurd payloads at the edge.
    client_max_body_size 1m;

    # Cheap hardening; a Content-Security-Policy comes later.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # What every proxied request carries. All proxy_set_header lines stay here: a location that
    # sets even one of its own inherits none of these (Nginx's rule), and would then send
    # "Host: web" — which Vite rejects with 403.
    proxy_http_version 1.1;
    # $http_host keeps the port ("localhost:8080"): the rooms' WebSocket refuses a page whose
    # Origin isn't this Host (M2-04, cross-site WebSocket hijacking). $host would drop it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The AI reviewer streams its answer (SSE, M1-19). By default Nginx buffers a response and
    # sends it when complete: the chat would appear all at once at the end. Turn that off, and
    # give a slow model time to finish.
    location /api/chat {
      limit_req zone=chat burst=3 nodelay;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_pass http://api;
    }

    location /api/ {
      proxy_pass http://api;
    }

    # Rooms (M2): one long-lived WebSocket per person. The server pings every 30 s, so a quiet
    # connection still has traffic; the long read timeout only catches a server that hangs.
    location /ws/ {
      limit_req zone=rooms burst=10 nodelay;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
