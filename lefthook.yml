# Git hooks — installed by `pnpm install` (the root "prepare" script).
# Fast checks on commit, slower ones on push; CI runs everything again.
# Skip once in an emergency with `git commit --no-verify` (CI will still catch it).

pre-commit:
  piped: true # format first, then lint the formatted files
  commands:
    format:
      glob: '*.{ts,tsx,js,json,yml,yaml,css,html}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
