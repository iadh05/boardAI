# Git hooks — installed by `pnpm install` (the root "prepare" script).
# Fast checks on commit, slower ones on push; CI runs everything again.
# Skip once in an emergency with `git commit --no-verify` (CI will still catch it).
#
# Tools are called through node_modules/.bin, not `pnpm exec`: on Windows, `pnpm exec`
# hangs when it gets a long list of file arguments (seen with ~50 staged files).

pre-commit:
  piped: true # format first, then lint the formatted files
  commands:
    format:
      glob: '*.{ts,tsx,js,json,yml,yaml,css,html}'
      run: node_modules/.bin/prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js}'
      # --no-warn-ignored: staged files that ESLint ignores on purpose (e.g. lint fixtures) are skipped quietly.
      run: node_modules/.bin/eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
