name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: 0 # git hooks are for local commits, not CI

# One job per check, so each shows as its own status on the PR.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json. Keep the version comment
      # alone on the uses: line so Dependabot can update it together with the SHA.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the PR's commits, not just the tip
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every commit in the PR
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Squash merge turns the PR title into the commit on main, so it must follow the same format.
      # The title goes through an env var, never straight into the script (it's user input).
      - name: Lint the PR title
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browsers are ~150 MB: cache them per Playwright version.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @designroom/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @designroom/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries (browser restored from cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @designroom/web exec playwright install-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # The edge proxy (infra/nginx): Nginx in Docker in front of the real server and Vite,
  # checked by infra/nginx/smoke.sh (routing, request ids, WebSocket upgrade, body limit, 429).
  edge:
    name: edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the server and Vite
        # On Linux, Nginx in Docker reaches the host through the Docker bridge, not loopback:
        # Vite must listen on every interface (--host). Node's server already does.
        run: |
          LLM_PROVIDER=fake pnpm --filter @designroom/server start > "$RUNNER_TEMP/server.log" 2>&1 &
          pnpm --filter @designroom/web dev --host 0.0.0.0 > "$RUNNER_TEMP/vite.log" 2>&1 &
      - run: docker compose up -d nginx
      - name: Wait for all three
        run: |
          for url in http://localhost:3000/api/health http://localhost:5173/ http://localhost:8080/api/health; do
            timeout 60 bash -c "until curl -sf -o /dev/null $url; do sleep 1; done" || { echo "not up: $url"; exit 1; }
          done
      - run: bash infra/nginx/smoke.sh
        env:
          SERVER_LOG: ${{ runner.temp }}/server.log
      - name: Logs
        if: failure()
        run: |
          docker compose logs nginx
          cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/vite.log"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm` here: this job never installs, so the pnpm store doesn't exist and
      # setup-node's post-step would fail trying to save it on a cache miss.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Known vulnerabilities in the whole dependency tree (high and critical fail the job).
      - run: pnpm audit --audit-level=high
      # On PRs: block dependency changes that add a vulnerable package or a non-permissive licence.
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Same single exception as auditConfig.ignoreGhsas in pnpm-workspace.yaml (braces, no fix released).
          allow-ghsas: GHSA-vfj7-8cjw-p6xm
