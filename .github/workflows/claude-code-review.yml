name: Claude Code Review

# Automatic AI review on every PR — step 5 of docs/workflow.md.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the DesignRoom project.

            Before reviewing, read CLAUDE.md, docs/rules/general.md, docs/rules/frontend.md,
            docs/rules/backend.md and docs/workflow.md. The PR description names a ticket in
            tickets/ — check its acceptance criteria.

            Look for, in this order:
            1. Bugs and missing edge cases
            2. Broken rules from docs/rules (quote the rule)
            3. Missing or weak tests (logic must be test-first; tests must describe behaviour)
            4. Security: user and LLM input treated as data, secrets, validation with zod
            5. Simpler or clearer ways to write the same thing

            This is a learning project: explain *why* for each point, briefly.

            Label every comment with a Conventional Comments prefix, as defined in
            docs/workflow.md: blocking:, issue:, suggestion:, question:, nit:, praise:.
            Use inline comments for specific lines and one top-level summary comment.
            Do not repeat what CI (lint, typecheck, tests) already reports.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
