# Local infrastructure. The apps themselves run on the host (`pnpm dev`); these services sit
# around them. Start with `docker compose up -d`, then open http://localhost:8080.
# Grafana LGTM (M1-26b) and Phoenix (M1-26c) for observability; Postgres and Redis in M3.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Docker Desktop defines host.docker.internal; this also makes it work on Linux.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # Grafana + its OpenTelemetry collector, Prometheus (metrics), Loki (logs) and Tempo (traces) in
  # one container (architecture §9). The server sends OTLP to :4318 when
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 is set in apps/server/.env.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      # Bound to this machine only: Grafana's login is admin / admin, and anyone reaching :4318
      # could push fake data. Host 3001: our server already has 3000.
      - '127.0.0.1:3001:3000' # Grafana UI
      - '127.0.0.1:4318:4318' # OTLP over HTTP: traces, metrics, logs
    volumes:
      - lgtm-data:/data # keep dashboards' history across restarts
      # Our "AI reviewer" dashboard, loaded at startup (edit in Grafana, then export the JSON here).
      - ./infra/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/designroom.yaml:ro
      - ./infra/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/designroom:ro
    restart: unless-stopped

  # GlitchTip: open-source error tracking that accepts the official Sentry SDKs (M1-25b). Our apps
  # keep @sentry/react and @sentry/node; only the DSN points here instead of sentry.io, so no
  # account and nothing leaves the machine. Adapted from glitchtip.com/assets/compose.sample.yml
  # in its low-RAM form (Postgres also serves as queue and cache, no Valkey; logs and uptime off).
  # Not started by `docker compose up`: `docker compose --profile errors up -d`, then
  # http://localhost:8000.
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    profiles: [errors]
    depends_on: [glitchtip-db]
    ports:
      - '127.0.0.1:8000:8000' # this machine only
    environment:
      DATABASE_URL: postgres://postgres:postgres@glitchtip-db:5432/postgres
      VALKEY_URL: '' # no Valkey: Postgres runs the task queue and cache
      SERVER_ROLE: all_in_one # web and worker in one container
      # Signs sessions of this local instance only. Override in the root .env (git-ignored).
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-local-dev-only-not-a-secret}
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: glitchtip@localhost
      EMAIL_URL: consolemail:// # emails go to the container log
      GLITCHTIP_ENABLE_LOGS: 'False'
      GLITCHTIP_ENABLE_UPTIME: 'False'
    volumes:
      - glitchtip-uploads:/code/uploads
    restart: unless-stopped

  glitchtip-db:
    image: postgres:18.6-alpine
    profiles: [errors]
    environment:
      # No password: the database is on Docker's internal network only, never published.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - glitchtip-db:/var/lib/postgresql
    restart: unless-stopped

volumes:
  lgtm-data:
  glitchtip-db:
  glitchtip-uploads:
